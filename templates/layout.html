<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FinSight – Personal Finance Platform. Track expenses, manage budgets, and achieve your financial goals." />
  <meta name="keywords"    content="finance, budget, expense tracker, savings, FinSight" />
  <meta name="author"      content="FinSight" />

  <title>{% block title %}FinSight{% endblock %} | Personal Finance</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cursor.css') }}" />

  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo.jpeg') }}" />

  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="theme-dash">
  <!-- Full Page Preloader -->
  <div id="page-preloader">
    <div class="preloader-content">
      <div class="preloader-logo-wrapper">
        <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="FinSight Logo" class="preloader-logo">
        <div class="preloader-pulse-ring"></div>
      </div>
      <div class="preloader-text">Loading<span class="dots">...</span></div>
      <div class="preloader-spinner"></div>
    </div>
  </div>


  <div id="cursor-dot"></div>
  <div id="cursor-ring" aria-hidden="true"></div>

  {% if request.endpoint in ['login_page', 'register_page'] %}
  <!-- Top Left Home Button (Login & Register Pages Only) -->
  <a href="{{ url_for('home') }}" class="top-home-btn" title="Go to Home Page">
    <i class="bi bi-house-door-fill"></i>
  </a>
  {% endif %}

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFGKwHdHnfVSFLjEfHMPpoNWMlF"
          crossorigin="anonymous"></script>

  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/cursor.js') }}"></script>

  {% block extra_js %}{% endblock %}
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
